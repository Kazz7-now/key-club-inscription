<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151a24">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <title>{% block title %}Key Club{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('index') }}" class="brand">
      <img src="{{ url_for('static', filename='images/key-club.png') }}" alt="Logo Key Club">
      <span>KEY CLUB</span>
    </a>
    <div class="nav-actions">
      {% if session.get('person') %}<a href="{{ url_for('my_registrations') }}" class="nav-my">Mes inscriptions</a>{% endif %}
      <a href="{{ url_for('inscription') }}" class="nav-register">S'inscrire</a>
    </div>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
